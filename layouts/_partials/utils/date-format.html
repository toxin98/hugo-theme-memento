{{ $date := .date }}
{{ $layout := .layout }}

{{ $dateMachine := $date | time.Format "2006-01-02T15:04:05-07:00" }}

<time class="local-time" data-time-layout="{{ $layout }}" datetime="{{ $dateMachine }}" hidden>{{ $date }}</time>

<noscript>
  <time datetime="{{ $dateMachine }}">{{ $date }}</time>
</noscript>
