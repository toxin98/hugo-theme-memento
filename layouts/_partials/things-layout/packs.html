<div class="things-scroll">

{{ range .Pages }}

  <a class="thing-item" href="{{ .RelPermalink }}">

    <div class="thing-image">
      {{ with .Resources.GetMatch .Params.image }}
        {{ $img := .Resize "200x webp q80" }}
        <img src="{{ $img.RelPermalink }}" alt="{{ $.Title }}">
      {{ end }}
    </div>

    <div class="thing-title">
      {{ .Title }}
    </div>

  </a>

{{ end }}

</div>
