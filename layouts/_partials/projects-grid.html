<ul class="entry-list">

{{ range . }}

  <li class="entry card">
    <a class="entry-link" href="{{ .RelPermalink }}" title="{{ .Title }}">

      <div class="entry-featured">
        {{ partial "utils/get-featured.html" . }}
      </div>
      <div class="entry-pro">
        <h3 class="entry-title">{{ .Title }}</h3>
        <p class="entry-desc">{{ .Description | default "There is no description." }}</p>
      </div>

    </a>
  </li>

{{ end }}

</ul>
