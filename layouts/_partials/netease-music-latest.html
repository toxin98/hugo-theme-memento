{{ $playlistID := .playlist_id }}
{{ $limit := .limit | default 3 }}
{{ $containerID := printf "netease-latest-%s" (substr (md5 (now.UnixNano)) 0 7) }}

<!-- require APlayer -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css">
<script src="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.js"></script>
<!-- require MetingJS -->
<script src="https://cdn.jsdelivr.net/npm/meting@2/dist/Meting.min.js"></script>
<!-- /* 关键：使用自定义 API 节点以绕过 IP 封锁 */ -->
<script>
  var meting_api = 'https://api.injahow.cn/meting/?server=:server&type=:type&id=:id&auth=:auth&r=:r';
</script>

<div id="{{ $containerID }}">
  <div class="cards-grid music-grid" id="{{ $containerID }}-grid">
    Loading...
  </div>
</div>

<script>
(function() {
  const containerID = '{{ $containerID }}';
  const gridContainer = document.getElementById(containerID + '-grid');
  const playlistID = '{{ $playlistID }}';
  const limit = Math.min(Math.max(parseInt('{{ $limit }}', 10) || 4, 1), 20);
  const apiURL = `https://api.injahow.cn/meting/?server=netease&type=playlist&id=${encodeURIComponent(playlistID)}`;

  fetch(apiURL)
    .then(response => {
      if (!response.ok) throw new Error(`Playlist request failed: ${response.status}`);
      return response.json();
    })
    .then(payload => {
      const songs = Array.isArray(payload) ? payload : payload && payload.data;
      const latest = Array.isArray(songs) ? songs.slice(0, limit) : [];

      function getSongID(song) {
        if (song && song.id) return String(song.id);
        if (!song || !song.url) return null;

        try {
          return new URL(song.url).searchParams.get('id');
        } catch {
          const match = String(song.url).match(/[?&]id=(\d+)/);
          return match ? match[1] : null;
        }
      }

      const songIDs = latest.map(getSongID).filter(Boolean);
      console.log('Netease latest song IDs:', songIDs);

      if (!songIDs.length) {
        gridContainer.textContent = 'Not able to retrieve the song';
        return;
      }

      gridContainer.replaceChildren();
      songIDs.forEach(songID => {
        const player = document.createElement('meting-js');
        player.setAttribute('auto', `https://music.163.com/#/song?id=${encodeURIComponent(songID)}`);
        player.setAttribute('theme', '#760411');
        gridContainer.appendChild(player);
      });
    })
    .catch(error => {
      console.error('Netease playlist fetch error:', error);
      gridContainer.textContent = 'Netease playlist fetch failed';
    });
})();
</script>
