{{ $username := .username }}
{{ $limit := .limit | default 4 }}
{{ $containerId := printf "trakt-history-%s" (substr (md5 (now.UnixNano)) 0 6) }}

<div id="{{ $containerId }}" class="trakt-container">
  <div class="trakt-cards-grid" id="{{ $containerId }}-grid">
    <!-- 初始由 JS 动态注入指定数量的骨架屏 -->
  </div>
  <div class="trakt-footer-bar">
    <span>
      Data provided by
      <a href="https://app.trakt.tv" target="_blank" rel="noopener" class="trakt-link">Trakt</a>
      <a href="https://app.trakt.tv/profile/{{ $username }}" target="_blank" rel="noopener" class="trakt-user-link">@{{ $username }}</a>
    </span>
  </div>
</div>

<style>
/* 容器及整体框架 */
.trakt-container {
  background-color: transparent;
  margin: 1.5rem 0;
  width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.trakt-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  width: 100%;
}

.trakt-loading-state {
  grid-column: 1 / -1;
  text-align: center;
  color: #a1a1aa;
  padding: 30px 0;
  font-size: 0.9rem;
}

/* 卡片基础样式 */
.trakt-exact-card {
  display: flex;
  position: relative;
  background-color: #18181b;
  border-radius: 8px;
  overflow: hidden;
  height: 108px;
  text-decoration: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.trakt-exact-card.has-backdrop::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(90deg, rgba(24, 24, 27, 0.98) 0%, rgba(24, 24, 27, 0.88) 59%, rgba(24, 24, 27, 0.35) 100%);
  pointer-events: none;
}

.trakt-card-backdrop {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 0;
  width: auto;
  height: 100%;
  max-width: none;
  opacity: 0;
  pointer-events: none;
  object-fit: contain;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.75) 28%, #000 58%);
  mask-image: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.75) 28%, #000 58%);
}

.trakt-exact-card.has-backdrop .trakt-card-backdrop {
  opacity: 1;
}

.trakt-exact-card > .trakt-card-poster-wrap,
.trakt-exact-card > .trakt-card-details {
  position: relative;
  z-index: 2;
}

.trakt-exact-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255, 255, 255, 0.25);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
}

/* 左侧海报区域 */
.trakt-card-poster-wrap {
  width: 72px;
  height: 100%;
  flex-shrink: 0;
  background-color: #27272a;
  overflow: hidden;
  position: relative;
}

.trakt-skeleton-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #a1a1aa;
  font-size: 0.72rem;
  letter-spacing: 0.02em;
}

.trakt-card-poster {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.trakt-card-poster.is-loaded {
  opacity: 1;
}

/* 右侧内容区域 */
.trakt-card-details {
  flex: 1;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
}

/* 标题样式：最多 3 行 */
.trakt-title-text {
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 700;
  line-height: 1.25;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 时间容器及样式 */
.trakt-time-wrap {
  margin-top: 4px;
}

.trakt-date-text,
.trakt-time-text {
  color: #a1a1aa;
  font-size: 0.8rem;
  line-height: 1.2;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 骨架屏动画效果 */
@keyframes traktPulse {
  0% { opacity: 0.3; }
  50% { opacity: 0.6; }
  100% { opacity: 0.3; }
}

.trakt-skeleton-block {
  background-color: #27272a;
  border-radius: 4px;
  animation: traktPulse 1.5s infinite ease-in-out;
}

.trakt-skeleton-title {
  width: 85%;
  height: 14px;
  margin-bottom: 6px;
}

.trakt-skeleton-subtitle {
  width: 60%;
  height: 12px;
}

.trakt-skeleton-date {
  width: 70%;
  height: 10px;
  margin-bottom: 4px;
}

.trakt-skeleton-time {
  width: 40%;
  height: 10px;
}

/* 页脚注释栏 */
.trakt-footer-bar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  font-size: 0.75rem;
  color: #71717a;
}
.trakt-footer-bar a { font-weight: 500; color: inherit; text-decoration: none; }
.trakt-link:hover {color: #9f42c6;}
.trakt-user-link:hover {color: #01b4e4;}
.trakt-footer-bar .dot { font-size: 0.6rem; }
</style>

<script>
(function() {
  const containerId = '{{ $containerId }}';
  const gridContainer = document.getElementById(containerId + '-grid');
  const username = '{{ $username }}';
  const requestedLimit = parseInt('{{ $limit }}', 10);
  const limit = Math.min(Math.max(Number.isFinite(requestedLimit) ? requestedLimit : 6, 1), 20);

  const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  function getOrdinal(d) {
    if (d > 3 && d < 21) return 'th';
    switch (d % 10) {
      case 1:  return "st";
      case 2:  return "nd";
      case 3:  return "rd";
      default: return "th";
    }
  }

  // 1. 第一阶段：立即渲染骨架屏
  function renderSkeletons() {
    gridContainer.innerHTML = '';
    for (let i = 0; i < limit; i++) {
      const card = document.createElement('div');
      card.className = 'trakt-exact-card';
      card.setAttribute('aria-busy', 'true');
      card.innerHTML = `
        <div class="trakt-card-poster-wrap trakt-skeleton-block">
          <span class="trakt-skeleton-loading">Loading…</span>
        </div>
        <div class="trakt-card-details">
          <div>
            <div class="trakt-skeleton-block trakt-skeleton-title"></div>
            <div class="trakt-skeleton-block trakt-skeleton-subtitle"></div>
          </div>
          <div class="trakt-time-wrap">
            <div class="trakt-skeleton-block trakt-skeleton-date"></div>
            <div class="trakt-skeleton-block trakt-skeleton-time"></div>
          </div>
        </div>
      `;
      gridContainer.appendChild(card);
    }
  }

  // 先显示骨架，再开始任何校验或网络请求。
  renderSkeletons();

  function showError(message) {
    gridContainer.innerHTML = '';
    const error = document.createElement('div');
    error.className = 'trakt-loading-state';
    error.style.color = '#ef4444';
    error.textContent = message;
    gridContainer.appendChild(error);
  }

  function getTraktImageUrl(images, type) {
    const rawImage = images && Array.isArray(images[type]) ? images[type][0] : null;
    const rawUrl = typeof rawImage === 'string' ? rawImage : rawImage && rawImage.url;
    if (!rawUrl) return null;
    return `/api/trakt-image?url=${encodeURIComponent(rawUrl)}`;
  }

  async function fetchTraktHistory() {
    const encodedUsername = encodeURIComponent(username);
    const res = await fetch(`/api/trakt/history?username=${encodedUsername}&limit=${limit}`);

    let data = null;
    try {
      data = await res.json();
    } catch {
      // 下面根据 HTTP 状态码给出更有用的错误信息。
    }

    if (!res.ok) {
      const error = new Error(`Trakt request failed: ${res.status}`);
      error.status = res.status;
      error.data = data;
      throw error;
    }

    if (!Array.isArray(data)) {
      throw new Error('Trakt returned an invalid history response');
    }

    return data;
  }

  function getTraktErrorMessage(error) {
    if (error && (error.status === 401 || error.status === 403)) {
      return 'Trakt 拒绝了请求：请检查 Cloudflare Secret TRAKT_CLIENT_ID 是否为正确的 Client ID';
    }
    if (error && error.status === 404) {
      return '找不到该 Trakt 用户，请检查用户名是否正确';
    }
    if (error instanceof TypeError) {
      return '无法连接 Trakt，请检查网络或跨域设置';
    }
    return '无法拉取 Trakt 观看记录，请稍后重试';
  }

  function createPosterImage(fallbackPoster, title) {
    const img = document.createElement('img');
    img.className = 'trakt-card-poster is-loaded';
    img.src = fallbackPoster;
    img.alt = title;
    return img;
  }

  function loadTraktImages(card, imgEl, backdropImg, images) {
    const posterUrl = getTraktImageUrl(images, 'poster');
    const backdropUrl = getTraktImageUrl(images, 'fanart') || getTraktImageUrl(images, 'thumb');

    if (backdropUrl && backdropImg) {
      backdropImg.onload = () => card.classList.add('has-backdrop');
      backdropImg.onerror = () => backdropImg.remove();
      backdropImg.src = backdropUrl;
    }

    if (posterUrl && imgEl && imgEl.isConnected) {
      // 先预加载，失败时保留本地占位图。
      const remoteImg = new Image();
      remoteImg.onload = () => {
        if (imgEl.isConnected) imgEl.src = posterUrl;
      };
      remoteImg.src = posterUrl;
    }
  }

  async function loadHistory() {
    // 给浏览器一个绘制骨架屏的机会，即使参数缺失也能看到加载状态。
    await new Promise(resolve => setTimeout(resolve, 0));

    if (!username) {
      showError('错误：未设置 Trakt 用户名');
      return;
    }

    try {
      // 第一阶段完成后，才清除骨架并渲染真实观看记录。
      const data = await fetchTraktHistory();

    if (!data || data.length === 0) {
      gridContainer.innerHTML = '<div class="trakt-loading-state">暂无最近观看记录</div>';
      return;
    }

    gridContainer.innerHTML = ''; // 清空骨架屏

    data.forEach((item, index) => {
      let mainTitle = '';
      let type = item.type;
      let traktSlug = '';

      if (type === 'movie' && item.movie) {
        mainTitle = item.movie.title;
        traktSlug = `movies/${item.movie.ids.slug}`;
      } else if (type === 'episode' && item.episode && item.show) {
        const s = item.episode.season;
        const e = item.episode.number;
        const epTitle = item.episode.title || '';
        mainTitle = `${item.show.title} S${s} • E${e}${epTitle ? ' - ' + epTitle : ''}`;
        traktSlug = `shows/${item.show.ids.slug}/seasons/${s}/episodes/${e}`;
      }

      const dateObj = new Date(item.watched_at);
      const monthStr = months[dateObj.getMonth()];
      const dayNum = dateObj.getDate();
      const yearNum = dateObj.getFullYear();
      const dateFormatted = `${monthStr} ${dayNum}${getOrdinal(dayNum)}, ${yearNum}`;

      const timeFormatted = dateObj.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });

      const fallbackPoster = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300"><rect width="200" height="300" fill="%2327272a"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2371717a" font-size="14" font-family="sans-serif">Poster Fetch Failed</text></svg>`;

      const card = document.createElement('a');
      card.className = 'trakt-exact-card';
      card.href = `https://app.trakt.tv/${traktSlug}`;
      card.target = '_blank';
      card.rel = 'noopener';
      card.setAttribute('aria-busy', 'false');

      const posterWrap = document.createElement('div');
      posterWrap.className = 'trakt-card-poster-wrap';
      const posterImg = createPosterImage(fallbackPoster, mainTitle);
      posterWrap.appendChild(posterImg);

      const backdropImg = document.createElement('img');
      backdropImg.className = 'trakt-card-backdrop';
      backdropImg.alt = '';
      backdropImg.setAttribute('aria-hidden', 'true');

      const details = document.createElement('div');
      details.className = 'trakt-card-details';
      const title = document.createElement('div');
      title.className = 'trakt-title-text';
      title.title = mainTitle;
      title.textContent = mainTitle;
      const timeWrap = document.createElement('div');
      timeWrap.className = 'trakt-time-wrap';
      const date = document.createElement('div');
      date.className = 'trakt-date-text';
      date.textContent = dateFormatted;
      const time = document.createElement('div');
      time.className = 'trakt-time-text';
      time.textContent = timeFormatted;
      timeWrap.append(date, time);
      details.append(title, timeWrap);
      card.append(backdropImg, posterWrap, details);

      gridContainer.appendChild(card);

      // Trakt 历史响应已包含图片信息，第三阶段只通过 Worker 加载缓存后的图片。
      const media = type === 'movie' ? item.movie : item.show;
      loadTraktImages(card, posterImg, backdropImg, media && media.images);
    });
    } catch (error) {
      console.error('Trakt Fetch Error:', error);
      showError(getTraktErrorMessage(error));
    }
  }

  loadHistory();
})();
</script>
