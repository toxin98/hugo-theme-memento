<div class="reading-header" aria-hidden="true">
  <div class="reading-header-buttons">
    <button class="reading-header-button" type="button" data-share-open>{{ partial "utils/icon.html" "share" }}</button>
    <button class="reading-header-button" data-target="right" type="button" aria-label="Open table of contents" aria-expanded="false">
      {{ partial "utils/icon.html" "list-tree" }}
    </button>
  </div>
  <h1 class="reading-header-title">{{ .Title }}</h1>
</div>
