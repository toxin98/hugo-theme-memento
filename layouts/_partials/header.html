<div class="header-top">
  <div class="wrapper">
    <div class="header-top-left">
      <button class="site-menu" id="hamburger">{{ partial "utils/icon.html" "menu-2" }}</button>
    </div>
    <div class="header-top-middle">
      <a href="/" class="site-brand">
        {{ with .Site.Params.logo }}
        <img class="site-logo" src="{{ . | relURL }}" alt="logo">
        {{ end }}
        <span class="site-title">{{ site.Title }}</span>
      </a>
    </div>
    <div class="header-top-right">
      <button class="site-search">{{ partial "utils/icon.html" "search" }}</button>
    </div>
  </div>
</div>
<div class="header-nav" id="siteNav">
  <div class="wrapper">
    {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
  </div>
</div>
{{ if .IsPage  }}
<div class="header-reading" aria-hidden="true">
  <div class="wrapper">
    <span class="header-reading-title">{{ .Title }}</span>
    <button class="sidebar-toggle sidebar-toggle-reading" data-target="right" type="button" aria-label="Open table of contents" aria-expanded="false">
      {{ partial "utils/icon.html" "list-tree" }}
    </button>
  </div>
</div>
{{ end }}
