<div class="wrapper topbar">
  <div class="topbar-left" data-navigation aria-expanded="false">
    <div class="segment-row">
      {{ with resources.Get site.Params.profile.avatar }}
        {{ $thumb := .Fill "70x70 center" }}
        <div class="segment topbar-avatar">
          <img src="{{ $thumb.RelPermalink }}" alt="avatar">
        </div>
      {{ end }}
      <div class="segment topbar-location">
        / {{ .FirstSection.Title }}
      </div>
    </div>
    {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
  </div>
  <div class="topbar-right hidden">
    <button>
      {{ partial "utils/icon.html" "share" }}
    </button>
  </div>
</div>
