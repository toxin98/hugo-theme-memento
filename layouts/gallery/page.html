{{ define "main" }}

<div class="wrapper gallery">

  <div class="masonry">
    {{ range .Resources.ByType "image" }}
      <figure class="item">
        <img
          src="{{ .RelPermalink }}"
          alt=""
          width="{{ .Width }}"
          height="{{ .Height }}"
          loading="lazy"
        >
      </figure>
    {{ end }}
  </div>

</div>

{{ end }}
