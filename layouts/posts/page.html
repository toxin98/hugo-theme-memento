{{ define "main" }}

  {{ with .Resources.Get .Params.featured }}
  <div class="page-hero">
    <img src="{{ .RelPermalink }}" alt="featured-img">
  </div>
  {{ end }}

  <div class="wrapper posts">

    <div class="three-column-layout">

      <aside class="sidebar" data-position="left">
        <h2><a href="{{ .FirstSection.RelPermalink }}">All posts</a></h2>
        <h3><a href="{{ .CurrentSection.RelPermalink }}"><span class="collection-date-year">{{ .Date.Format "2006" }}</span></h3></a>
        <time class="collection-date narrow" datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}" aria-label="{{ .Date.Format "2006-01-02" }}">
          <span class="collection-date-month">{{ .Date.Format "January" }}</span>
          <span class="collection-date-day">{{ .Date.Format "02" }}</span>
        </time>
      </aside>

      <div class="primary-area">

        <article class="content">
          <h1>{{ .Title }}</h1>
          {{ .Content }}
          {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
        </article>

      </div>

      <aside class="sidebar" data-position="right">
        {{ partial "toc.html" . }}
      </aside>

    </div>

    <div class="fixed-bottom-bar">
      <button class="sidebar-toggle" data-target="left">{{ partial "utils/icon.html" "layout-sidebar-left-expand" }}</button>
      <button class="sidebar-toggle" data-target="right">{{ partial "utils/icon.html" "list-tree" }}</button>
    </div>

    <div class="sidebar-overlay"></div>

  </div>

{{ end }}
