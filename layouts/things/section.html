{{ define "main" }}

  <div class="wrapper">

    <aside class="sidebar-left">
    </aside>

    <div class="middle-container">

      <ul>
        {{ range .Sections }}
        <li>
          <h2>{{ .Title }}</h2>
          {{ $pages := .Pages }}
          {{ $pages = sort $pages ".Params.start" "desc" }}
          {{ partial "things-cards.html" (dict "pages" $pages) }}
        </li>
        {{ end }}
      </ul>

    </div>

    <aside class="sidebar-right">
    </aside>

  </div>

{{ end }}
